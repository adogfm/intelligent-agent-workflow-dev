[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "python-code-review-agent"
version = "0.1.0"
description = "A Python code review agent with local tools and optional Qwen review through an OpenAI-compatible API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.26.0,<3.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "python-dotenv>=1.2.0,<2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1,<10.0.0",
]

[project.scripts]
code-review-agent = "main:main"
code-review-benchmark = "benchmarks.run:main"
homework2-demo = "demo:main"

[tool.setuptools]
py-modules = [
    "agent",
    "code_checker",
    "coding_agent",
    "demo",
    "file_editor",
    "fix_agent",
    "llm",
    "main",
    "models",
    "planner",
    "prompt",
    "review_policy",
    "test_agent",
    "test_feedback",
    "test_worker",
]
packages = ["benchmarks", "workflow"]

[tool.pytest.ini_options]
# Root-level test_agent.py/test_feedback.py are application modules.
testpaths = ["tests"]
